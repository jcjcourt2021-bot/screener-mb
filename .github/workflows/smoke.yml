name: App smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py
      - run: DB_PATH=/tmp/equity-test.db python -c "import main; assert main.health()['ok']; assert main.state()['provider_status'] == 'Scanner not run yet'; print('App import and health smoke test passed')"
